# Plataforma local completa: 3 motores de datos + Kafka + Eureka + 4 servicios
# + gateway + frontend. La API entra por 8080 y el panel web por 3000; Eureka
# (8762) y Kafka UI (8090) se publican para inspeccionarlos desde el navegador.

name: hospital-microservices

x-service-healthcheck: &service-healthcheck
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 60s

services:
  # ------------------------------------------------------------- eventos --
  # Kafka 4 funciona sin ZooKeeper mediante KRaft. Solo se anuncia dentro de
  # la red de Compose: los microservicios lo alcanzan como kafka:9092.
  kafka:
    image: apache/kafka:4.1.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  # Interfaz web para ver tópicos, particiones, offsets y mensajes de Kafka.
  # El frontend también consulta su API para mostrar las particiones.
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.3.0
    ports: ["8090:8080"]   # http://localhost:8090
    environment:
      KAFKA_CLUSTERS_0_NAME: hospital
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  # ----------------------------------------------------------------- datos --
  mongo:
    image: mongo:8.0
    environment:
      MONGO_INITDB_DATABASE: clinicaldb
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: doctordb
      POSTGRES_USER: hospital
      POSTGRES_PASSWORD: hospital
    # PostgreSQL 18+ guarda los datos en subdirectorios por versión mayor:
    # el volumen debe montarse en /var/lib/postgresql, no en .../data.
    volumes: [postgres-data:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hospital -d doctordb"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: clientdb
      MYSQL_USER: hospital
      MYSQL_PASSWORD: hospital
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s
    restart: unless-stopped

  # ------------------------------------------------------- descubrimiento --
  eureka-server:
    build: { context: ., dockerfile: eureka-server/Dockerfile }
    ports: ["8762:8761"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8761/actuator/health"]
      <<: *service-healthcheck
    restart: unless-stopped

  # -------------------------------------------------------------- dominio --
  doctor-service:
    build: { context: ., dockerfile: doctor-service/Dockerfile }
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka/
      POSTGRES_URL: jdbc:postgresql://postgres:5432/doctordb
      POSTGRES_USER: hospital
      POSTGRES_PASSWORD: hospital
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres: { condition: service_healthy }
      eureka-server: { condition: service_healthy }
      kafka: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
      <<: *service-healthcheck
    restart: unless-stopped

  clinical-history-service:
    build: { context: ., dockerfile: clinical-history-service/Dockerfile }
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka/
      MONGO_URI: mongodb://mongo:27017/clinicaldb
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      mongo: { condition: service_healthy }
      eureka-server: { condition: service_healthy }
      kafka: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/actuator/health"]
      <<: *service-healthcheck
    restart: unless-stopped

  client-service:
    build: { context: ./client-service, dockerfile: Dockerfile }
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka
      MYSQL_DSN: hospital:hospital@tcp(mysql:3306)/clientdb?charset=utf8mb4&parseTime=True&loc=Local
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      mysql: { condition: service_healthy }
      eureka-server: { condition: service_healthy }
      kafka: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # Consumidor de los eventos de los tres dominios. Conserva una vista de
  # auditoría en memoria y la expone por REST para verificar el flujo completo.
  audit-service:
    build: { context: ., dockerfile: audit-service/Dockerfile }
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      kafka: { condition: service_healthy }
      eureka-server: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8084/actuator/health"]
      <<: *service-healthcheck
    restart: unless-stopped

  # --------------------------------------------------------- punto entrada --
  api-gateway:
    build: { context: ., dockerfile: api-gateway/Dockerfile }
    ports: ["8080:8080"]
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka/
    depends_on:
      eureka-server: { condition: service_healthy }
      doctor-service: { condition: service_healthy }
      clinical-history-service: { condition: service_healthy }
      client-service: { condition: service_healthy }
      audit-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      <<: *service-healthcheck
    restart: unless-stopped

  # ------------------------------------------------------------- frontend --
  # React servido por nginx. nginx hace de proxy hacia el gateway, Eureka y
  # Kafka UI, así el navegador solo habla con http://localhost:3000.
  frontend:
    build: { context: ./frontend }
    ports: ["3000:80"]
    environment:
      ARQUITECTURA: kafka   # rest | rabbitmq | kafka: qué panel se muestra
    depends_on:
      api-gateway: { condition: service_started }
      kafka-ui: { condition: service_started }
    restart: unless-stopped

volumes:
  mongo-data:
  postgres-data:
  mysql-data:
  kafka-data:
