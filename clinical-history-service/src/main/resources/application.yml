# ---------------------------------------------------------------------------
# clinical-history-service · historias clínicas (MongoDB)
# ---------------------------------------------------------------------------
server:
  port: 8082

spring:
  application:
    # Con este nombre se registra en Eureka y con él lo busca el gateway (lb://).
    name: clinical-history-service

  mongodb:
    # OJO: en Spring Boot 4 esta clave se movió de spring.data.mongodb.uri a
    # spring.mongodb.uri. La anterior quedó deprecada a nivel "error": no falla
    # el arranque, simplemente se ignora y el driver se va a localhost.
    # El valor por defecto sirve dentro de Compose; MONGO_URI lo sobreescribe.
    uri: ${MONGO_URI:mongodb://mongo:27017/clinicaldb}

  rabbitmq:
    # RabbitMQ reemplaza la llamada HTTP de OpenFeign. El host es el nombre DNS
    # del contenedor en Compose; las variables permiten cambiarlo sin recompilar.
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:hospital}
    password: ${RABBITMQ_PASSWORD:hospital}
    template:
      # El patrón RPC espera respuesta, pero nunca de forma indefinida. Si
      # doctor-service no consume en 3 s, el cliente recibe UNAVAILABLE -> 503.
      reply-timeout: 3s

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://eureka-server:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        # /actuator/health es el que consulta el healthcheck de Docker Compose.
        include: health,info
